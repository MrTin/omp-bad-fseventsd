name: ci
on:
  push:
    branches: [main]
  pull_request:
  # omp ships often; catch API drift before users hit "Failed to load extension".
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test

  # Typecheck and test against the newest omp, not the pinned dev types.
  latest-omp:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun add -d @oh-my-pi/pi-coding-agent@latest @oh-my-pi/pi-utils@latest
      - run: bun run check
      - run: bun test
